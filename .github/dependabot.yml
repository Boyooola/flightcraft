version: 2

updates:
  # 📦 JavaScript / React Native dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    groups:
      react-native:
        patterns:
          - "react"
          - "react-native"
          - "react-native-*"

      expo:
        patterns:
          - "expo"
          - "expo-*"

      mapbox:
        patterns:
          - "@rnmapbox/*"
          - "mapbox*"

      navigation:
        patterns:
          - "@react-navigation/*"

  # 🤖 Android / Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

    groups:
      android:
        patterns:
          - "*"
