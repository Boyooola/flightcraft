name: Android CI/CD

on:
  push:
    branches:
      - dev
      - master

  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # ----------------------------
      # 🔐 KEYS SETUP (SECURE)
      # ----------------------------
      - name: Decode Keystore
        if: github.ref_name == 'master'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Move Keystore to Android folder
        if: github.ref_name == 'master'
        run: |
          mkdir -p android/app
          mv release-key.jks android/app/release-key.jks

      # ----------------------------
      # 🔧 FIX PERMISSIONS
      # ----------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----------------------------
      # 📱 DEV BUILD (APK)
      # ----------------------------
      - name: Build Dev APK
        if: github.ref_name == 'dev'
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: android/app/build/outputs/apk/release/*.apk

      # ----------------------------
      # 🚀 PRODUCTION BUILD (AAB)
      # ----------------------------
      - name: Inject signing env vars
        if: github.ref_name == 'master'
        run: echo "Preparing release build"

        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build Release AAB
        if: github.ref_name == 'master'
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload AAB
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
