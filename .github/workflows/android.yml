name: Android CI/CD

on:
  push:
    branches:
      - dev
      - master

  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # ----------------------------
      # 🔢 VERSION BUMP (MASTER ONLY)
      # ----------------------------

      - name: Bump versionCode
        if: github.ref_name == 'master'
        run: |
          FILE=android/app/build.gradle

          VERSION_CODE=$(grep versionCode $FILE | head -1 | awk '{print $2}')
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i "s/versionCode $VERSION_CODE/versionCode $NEW_VERSION_CODE/" $FILE

          echo "versionCode updated: $NEW_VERSION_CODE"

      - name: Bump versionName
        if: github.ref_name == 'master'
        run: |
          FILE=android/app/build.gradle

          VERSION_NAME=$(grep versionName $FILE | head -1 | awk '{print $2}' | tr -d '"')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"

          PATCH=$((PATCH + 1))
          NEW_VERSION_NAME="$MAJOR.$MINOR.$PATCH"

          sed -i "s/versionName \"$VERSION_NAME\"/versionName \"$NEW_VERSION_NAME\"/" $FILE

          echo "versionName updated: $NEW_VERSION_NAME"

      # ----------------------------
      # 🔧 PERMISSIONS FIX
      # ----------------------------

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----------------------------
      # 📱 DEV BUILD (APK)
      # ----------------------------

      - name: Build Dev APK
        if: github.ref_name == 'dev'
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: android/app/build/outputs/apk/release/*.apk

      # ----------------------------
      # 🚀 MASTER BUILD (AAB)
      # ----------------------------

      - name: Build Release AAB
        if: github.ref_name == 'master'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # ----------------------------
      # 💾 COMMIT VERSION BUMP BACK
      # ----------------------------

      - name: Commit version bump
        if: github.ref_name == 'master'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add android/app/build.gradle
          git commit -m "chore: bump version [skip ci]" || echo "No changes"
          git push
