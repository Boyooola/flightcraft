name: Android CI/CD

on:
  push:
    branches:
      - dev
      - master

  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 📥 CHECKOUT
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------
      # 🟢 NODE.JS
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # ☕ JAVA 17
      # ----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ----------------------------
      # 🤖 ANDROID SDK
      # ----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ----------------------------
      # 📦 INSTALL DEPENDENCIES
      # ----------------------------
      - name: Install dependencies
        run: npm install

      # ----------------------------
      # 🔧 GRADLE PERMISSIONS
      # ----------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----------------------------
      # 🧹 CLEAN ANDROID BUILD
      # ----------------------------
      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      # ----------------------------
      # 🔐 VERIFY KEYSTORE
      # ----------------------------
      - name: Verify keystore
        run: |
          keytool -list -v \
            -keystore android/app/release-key.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      # ----------------------------
      # 🔐 SET SIGNING PROPERTIES
      # ----------------------------
      # Uncomment this section if your Gradle configuration
      # expects these values in gradle.properties.
      #
      # - name: Set Gradle signing properties
      #   run: |
      #     echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties

      # ----------------------------
      # 📱 DEV BUILD (DEBUG APK)
      # ----------------------------
      - name: Build Dev APK
        if: github.ref_name == 'dev'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ----------------------------
      # 🚀 PRODUCTION BUILD (AAB)
      # ----------------------------
      - name: Build Release AAB
        if: github.ref_name == 'master'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
