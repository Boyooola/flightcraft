name: Android CI/CD

on:
  push:
    branches:
      - dev
      - master
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # ----------------------------
      # 🔧 PERMISSIONS FIX
      # ----------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----------------------------
      # 🔐 LOAD KEYSTORE (TAG ONLY)
      # ----------------------------
      - name: Verify keystore
        run: |
          keytool -list -v \
            -keystore android/app/release-key.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Set Gradle signing properties
        run: |
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties

      # ----------------------------
      # 📱 DEV BUILD (APK)
      # ----------------------------
      - name: Build Dev APK
        if: github.ref_type == 'branch'
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Dev APK
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: android/app/build/outputs/apk/release/*.apk

      # ----------------------------
      # 🚀 RELEASE BUILD (AAB ONLY ON TAGS)
      # ----------------------------
      - name: Build Release AAB
        if: github.ref_type == 'tag'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
