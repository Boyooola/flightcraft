name: Android CI/CD

on:
  push:
    branches:
      - dev
      - master

  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 📥 CHECKOUT
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------
      # 🟢 NODE.JS
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # ☕ JAVA 17
      # ----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ----------------------------
      # 🤖 ANDROID SDK
      # ----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------
      # 📦 INSTALL DEPENDENCIES
      # ----------------------------
      - name: Install dependencies
        run: npm install

      # ----------------------------
      # 🔧 GRADLE PERMISSIONS
      # ----------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----------------------------
      # 🔐 VERIFY KEYSTORE (MASTER ONLY)
      # ----------------------------
      - name: Verify keystore
        if: github.ref_name == 'master'
        run: |
          keytool -list -v \
            -keystore android/app/release-key.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      # ----------------------------
      # 🔐 SET SIGNING PROPERTIES
      # ----------------------------
      - name: Set Gradle signing properties
        if: github.ref_name == 'master'
        run: |
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties

      # ----------------------------
      # 📱 DEV BUILD (DEBUG APK)
      # ----------------------------
      - name: Build Dev APK
        if: github.ref_name == 'dev'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Dev APK
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # ----------------------------
      # 🚀 PRODUCTION BUILD (AAB)
      # ----------------------------
      - name: Build Release AAB
        if: github.ref_name == 'master'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        if: github.ref_name == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/*.aab
