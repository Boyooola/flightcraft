name: Block Major Dependency Updates

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Dependabot PR
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Checking dependency changes..."

          if git diff --name-only origin/main | grep package.json; then
            echo "Dependency update detected"
          fi
